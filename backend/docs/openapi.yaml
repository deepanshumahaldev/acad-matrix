  /api/v1/academics/subjects:
    get:
      tags: [Academics]
      summary: List subjects
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Subjects list }
    post:
      tags: [Academics]
      summary: Create subject (Admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Subject created }
  /api/v1/academics/subjects/{id}:
    get:
      tags: [Academics]
      summary: Get subject details
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Subject details }
    patch:
      tags: [Academics]
      summary: Update subject (Admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Subject updated }
    delete:
      tags: [Academics]
      summary: Soft delete subject (Admin only)
