      tags: [Academics]
      summary: List faculty-subject-section allocations
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Allocations list }
    post:
      tags: [Academics]
      summary: Create allocation (Admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Allocation created }
  /api/v1/academics/allocations/{id}:
    delete:
      tags: [Academics]
      summary: Remove allocation (Admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Deleted }
  # ── Timetable ──
  /api/v1/timetable:
    get:
      tags: [Timetable]
      summary: List timetable slots with filters
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: List of timetable slots }
    post:
      tags: [Timetable]
      summary: Create timetable slot with conflict checks (Admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Slot created }
        '409': { description: Conflict with existing faculty, room, or section }
  /api/v1/timetable/my:
    get:
      tags: [Timetable]
      summary: Get role-specific timetable (own section for student, own teaching for faculty)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Schedule slots }
  /api/v1/timetable/{id}:
    get:
      tags: [Timetable]
      summary: Get slot details
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Slot details }
    patch:
      tags: [Timetable]
      summary: Update slot (Admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Slot updated }
    delete:
      tags: [Timetable]
      summary: Delete slot (Admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Deleted }
  # ── Attendance ──
  /api/v1/attendance/my:
    get:
      tags: [Attendance]
      summary: Get authenticated student attendance summary & history
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Attendance statistics and record history }
  /api/v1/attendance/sessions:
    get:
      tags: [Attendance]
      summary: List attendance sessions
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Sessions list }
  /api/v1/attendance/sessions/{id}:
    get:
      tags: [Attendance]
      summary: Get session with full student record roster
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Session details }
    patch:
      tags: [Attendance]
      summary: Update attendance session records (Faculty/Admin)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Session updated }
  /api/v1/attendance/roster/{id}:
    get:
      tags: [Attendance]
      summary: Get student roster for a subject allocation
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Roster of students }
  /api/v1/attendance/mark:
    post:
      tags: [Attendance]
      summary: Mark attendance for a section period (Faculty/Admin)
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Attendance marked }
        '409': { description: Attendance already marked for this date and period }
  /api/v1/attendance/student/{id}/summary:
    get:
      tags: [Attendance]
      summary: Get attendance summary for any student (Admin/Faculty)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Overall & subject-wise attendance percentages }
  # ── Notifications ──
  /api/v1/notifications/inbox:
    get:
      tags: [Notifications]
      summary: Get notification inbox for current user
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Inbox items }
  /api/v1/notifications/unread-count:
    get:
      tags: [Notifications]
      summary: Get unread notification count
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Unread count }
  /api/v1/notifications/{id}/read:
    patch:
      tags: [Notifications]
      summary: Mark notification as read
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Marked read }
  /api/v1/notifications/read-all:
    post:
      tags: [Notifications]
      summary: Mark all notifications as read
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: All marked read }
  /api/v1/notifications/send:
    post:
      tags: [Notifications]
      summary: Send broadcast or targeted notification (Admin/Faculty)
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Notification sent }
  # ── Assignments ──
  /api/v1/assignments:
    get:
      tags: [Assignments]
      summary: List assignments
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: List of assignments }
    post:
      tags: [Assignments]
      summary: Create assignment (Admin/Faculty)
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Assignment created }
  /api/v1/assignments/{id}:
    get:
      tags: [Assignments]
      summary: Get assignment details
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Assignment details }
    patch:
      tags: [Assignments]
      summary: Update assignment
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Assignment updated }
    delete:
      tags: [Assignments]
      summary: Delete assignment
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Assignment deleted }
  /api/v1/assignments/{id}/submit:
    post:
      tags: [Assignments]
      summary: Submit assignment (Student)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201': { description: Assignment submitted }
  /api/v1/assignments/submissions/{id}/grade:
    post:
      tags: [Assignments]
      summary: Grade assignment submission (Faculty/Admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Submission graded }
  # ── Exams ──
