      tags: [Exams]
      summary: Get current student's exam results
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Exam results }
  /api/v1/exams/{id}:
    get:
      tags: [Exams]
      summary: Get exam details and results
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Exam details }
    patch:
      tags: [Exams]
      summary: Update exam
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Exam updated }
    delete:
      tags: [Exams]
      summary: Delete exam (Admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Exam deleted }
  /api/v1/exams/{id}/results:
    post:
      tags: [Exams]
      summary: Record student marks for exam
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Results recorded }
  # ── Fees ──
  /api/v1/fees/structures:
    get:
      tags: [Fees]
      summary: List fee structures
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Fee structures }
    post:
      tags: [Fees]
      summary: Create fee structure (Admin)
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Fee structure created }
  /api/v1/fees/structures/assign:
    post:
      tags: [Fees]
      summary: Assign fee structure to students (Admin)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Fees assigned }
  /api/v1/fees/student-fees:
    get:
      tags: [Fees]
      summary: List student fees
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Student fee records }
  /api/v1/fees/my-summary:
    get:
      tags: [Fees]
      summary: Get student fee summary & pending balance
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Student fee summary }
  /api/v1/fees/student-fees/{id}:
    get:
      tags: [Fees]
      summary: Get student fee details with payments
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Student fee details }
  /api/v1/fees/payments:
    post:
      tags: [Fees]
      summary: Record payment entry (Admin)
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Payment recorded }
  # ── Support ──
  /api/v1/support:
    get:
      tags: [Support]
      summary: List support tickets
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Support tickets }
    post:
      tags: [Support]
      summary: Raise support ticket
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Ticket raised }
  /api/v1/support/{id}:
    get:
      tags: [Support]
      summary: Get support ticket with conversation thread
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Ticket details }
    patch:
      tags: [Support]
      summary: Update ticket status or assignee (Admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Ticket updated }
  /api/v1/support/{id}/reply:
    post:
      tags: [Support]
      summary: Reply to support ticket
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201': { description: Message added }
  # ── Dashboard ──
  /api/v1/dashboard:
    get:
      tags: [Dashboard]
      summary: Get role-tailored dashboard metrics and schedule
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Role-specific dashboard payload }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties: { email: { type: string, format: email }, password: { type: string } }
    VerifyOtpRequest:
      type: object
      required: [challengeId, code]
      properties: { challengeId: { type: string, format: uuid }, code: { type: string, pattern: '^[0-9]{6}$' } }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties: { currentPassword: { type: string }, newPassword: { type: string, minLength: 8, description: Needs upper, lower and a digit } }
    ResetPasswordRequest:
      type: object
      required: [challengeId, code, newPassword]
      properties: { challengeId: { type: string, format: uuid }, code: { type: string }, newPassword: { type: string, minLength: 8 } }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        role: { type: string, enum: [ADMIN, FACULTY, STUDENT] }
        firstName: { type: string }
        lastName: { type: string }
        mustChangePassword: { type: boolean }
    ChallengeEnvelope:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: object
          properties:
            challengeId: { type: string, format: uuid }
            email: { type: string, description: Masked }
            expiresInSeconds: { type: integer }
            resendAfterSeconds: { type: integer }
    SessionEnvelope:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: object
          properties:
            accessToken: { type: string }
            expiresIn: { type: integer }
            user: { $ref: '#/components/schemas/User' }
    LivenessEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            status: { type: string, example: ok }
            uptimeSeconds: { type: integer }
            timestamp: { type: string, format: date-time }
    ReadinessEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            status: { type: string, example: ok }
            uptimeSeconds: { type: integer }
            timestamp: { type: string, format: date-time }
            checks:
              type: object
              properties:
                database:
                  type: object
                  properties:
                    status: { type: string, enum: [up, down] }
                    latencyMs: { type: integer, nullable: true }
    ErrorEnvelope:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: VALIDATION_ERROR }
            message: { type: string }
            details: {}
        requestId: { type: string }
