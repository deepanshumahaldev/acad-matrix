  /api/v1/academics/semesters/{id}:
    get:
      tags: [Academics]
      summary: Get semester details
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Semester details }
    patch:
      tags: [Academics]
      summary: Update semester (Admin only)
      security: [{ bearerAuth: [] }]
