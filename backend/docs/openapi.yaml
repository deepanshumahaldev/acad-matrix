        '201': { description: Section created }
  /api/v1/academics/sections/{id}:
    get:
      tags: [Academics]
      summary: Get section details
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Section details }
    patch:
      tags: [Academics]
      summary: Update section (Admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Section updated }
    delete:
      tags: [Academics]
      summary: Soft delete section (Admin only)
      security: [{ bearerAuth: [] }]
