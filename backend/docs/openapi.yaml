openapi: 3.0.3
info:
  title: AcadMatrix API
  version: 0.1.0
  description: |
    REST API for the AcadMatrix college student management system.
    This contract grows with each build phase; the frontend depends only on this document.
servers:
  - url: http://localhost:4000
tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Academics
  - name: Timetable
  - name: Attendance
  - name: Notifications
paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness probe
      responses:
        '200':
          description: Process is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessEnvelope'
  /health/ready:
    get:
      tags: [Health]
      summary: Readiness probe (checks the database)
      responses:
        '200':
          description: All dependencies reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessEnvelope'
        '503':
          description: A dependency is down
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Step 1 — verify email + password, email a 6-digit OTP
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { description: OTP sent, content: { application/json: { schema: { $ref: '#/components/schemas/ChallengeEnvelope' } } } }
        '401': { description: INVALID_CREDENTIALS }
        '403': { description: ACCOUNT_INACTIVE }
        '422': { description: VALIDATION_ERROR }
        '423': { description: ACCOUNT_LOCKED (details.retryAfterSeconds) }
        '429': { description: Rate limited }
        '502': { description: EMAIL_DELIVERY_FAILED }
  /api/v1/auth/verify-otp:
    post:
      tags: [Auth]
      summary: Step 2 — verify the OTP and start a session
      description: Sets the refresh token as an httpOnly cookie (`AcadMatrix_rt`, path `/api/v1/auth`). The body carries only the access token.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyOtpRequest' }
      responses:
        '200': { description: Session started, content: { application/json: { schema: { $ref: '#/components/schemas/SessionEnvelope' } } } }
        '400': { description: OTP_INVALID (details.attemptsRemaining) or OTP_EXPIRED }
        '429': { description: OTP_ATTEMPTS_EXCEEDED }
  /api/v1/auth/resend-otp:
    post:
      tags: [Auth]
      summary: Send a new OTP (60-second cooldown)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [challengeId], properties: { challengeId: { type: string, format: uuid } } }
      responses:
        '200': { description: New challenge, content: { application/json: { schema: { $ref: '#/components/schemas/ChallengeEnvelope' } } } }
        '429': { description: OTP_RESEND_COOLDOWN (details.retryAfterSeconds) }
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate the refresh cookie and get a new access token
      description: Replaying an already-rotated token revokes the whole login family.
      responses:
        '200': { description: New session, content: { application/json: { schema: { $ref: '#/components/schemas/SessionEnvelope' } } } }
        '401': { description: Session expired }
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current session and clear the cookie (idempotent)
      responses:
        '200': { description: Logged out }
  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Current user
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: The signed-in user }
        '401': { description: Missing or invalid token }
  /api/v1/auth/change-password:
    post:
      tags: [Auth]
      summary: Change password (also clears the forced-change flag)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '200': { description: New session issued; all other sessions revoked, content: { application/json: { schema: { $ref: '#/components/schemas/SessionEnvelope' } } } }
        '400': { description: CURRENT_PASSWORD_INCORRECT }
  /api/v1/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Email a reset code (same response whether or not the email exists)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email], properties: { email: { type: string, format: email } } }
      responses:
        '200': { description: Challenge returned, content: { application/json: { schema: { type: object, properties: { success: { type: boolean }, data: { type: object, properties: { challengeId: { type: string, format: uuid }, resendAfterSeconds: { type: integer } } } } } } } }
  /api/v1/auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password with the emailed code (unlocks the account, revokes all sessions)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '200': { description: Password reset }
        '400': { description: OTP_INVALID or OTP_EXPIRED }
  # ── Users Module ──
  /api/v1/users/faculty:
    get:
      tags: [Users]
      summary: List faculty with pagination and filters
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: List of faculty }
    post:
      tags: [Users]
      summary: Create faculty (Admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Faculty created }
  /api/v1/users/faculty/import-csv:
    post:
      tags: [Users]
      summary: Bulk import faculty from CSV (Admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Import summary and error report }
  /api/v1/users/faculty/{id}:
    get:
      tags: [Users]
      summary: Get faculty details
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Faculty details }
    patch:
      tags: [Users]
      summary: Update faculty (Admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Faculty updated }
  /api/v1/users/faculty/{id}/status:
    patch:
      tags: [Users]
      summary: Toggle faculty status ACTIVE/INACTIVE (Admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Status updated }
  /api/v1/users/students:
    get:
      tags: [Users]
      summary: List students with pagination and filters
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: List of students }
    post:
      tags: [Users]
      summary: Create student (Admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Student created }
  /api/v1/users/students/import-csv:
    post:
      tags: [Users]
      summary: Bulk import students from CSV (Admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Import summary and error report }
  /api/v1/users/students/{id}:
    get:
      tags: [Users]
      summary: Get student details
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Student details }
    patch:
      tags: [Users]
      summary: Update student (Admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Student updated }
  /api/v1/users/students/{id}/status:
    patch:
      tags: [Users]
      summary: Toggle student status ACTIVE/INACTIVE (Admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Status updated }
  /api/v1/users/{id}/unlock:
    post:
      tags: [Users]
      summary: Unlock locked account (Admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Account unlocked }
  # ── Academics Module ──
  /api/v1/academics/departments:
    get:
      tags: [Academics]
      summary: List departments
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Departments list }
    post:
      tags: [Academics]
      summary: Create department (Admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Department created }
  /api/v1/academics/departments/{id}:
    get:
      tags: [Academics]
      summary: Get department details
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Department details }
    patch:
      tags: [Academics]
      summary: Update department (Admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Department updated }
    delete:
      tags: [Academics]
      summary: Soft delete department (Admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Deleted }
  /api/v1/academics/courses:
    get:
      tags: [Academics]
      summary: List courses
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Courses list }
    post:
      tags: [Academics]
      summary: Create course (Admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Course created }
  /api/v1/academics/courses/{id}:
    get:
      tags: [Academics]
      summary: Get course details
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Course details }
    patch:
      tags: [Academics]
      summary: Update course (Admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Course updated }
    delete:
      tags: [Academics]
      summary: Soft delete course (Admin only)
      security: [{ bearerAuth: [] }]
